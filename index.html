<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Busca nos leilões da Receita</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--bd:#2a2f3a;--tx:#e6e8ee;--mu:#8b93a7;--ac:#4f9cff;--novo:#3ecf8e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:900px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mu);margin-bottom:16px;font-size:14px}
.barra{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input[type=text]{flex:1;min-width:220px;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
button{padding:10px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-size:14px}
button.on{border-color:var(--ac);color:var(--ac)}
.n{color:var(--mu);margin:8px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.t{font-weight:600}
.m{color:var(--mu);font-size:13px}
ul{margin:8px 0 0;padding-left:18px}
.av{color:#e0b341;font-size:13px;margin-top:6px}
.novo{display:inline-block;background:var(--novo);color:#06251a;border-radius:6px;padding:0 6px;font-size:12px;font-weight:700;margin-left:6px}
a{color:var(--ac)}
</style>
</head>
<body>
<main>
  <h1>Busca nos leilões da Receita Federal</h1>
  <div class="sub" id="sub">Carregando...</div>
  <div class="barra">
    <input type="text" id="q" placeholder="Digite o produto (ex.: playstation, xbox, iphone)" autofocus>
    <button id="ps5">PlayStation 5</button>
    <button id="xbox">Xbox</button>
    <button id="novos">Só novos</button>
  </div>
  <div class="n" id="n"></div>
  <div id="r"></div>
</main>
<script>
const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const brl = v => v == null ? "?" : Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const PS5 = /play\s*station\s*5|\bps\s*5\b|\bps5\b/, XBOX = /x\s*box/;
const TRES_DIAS = 3 * 864e5;
const $ = id => document.getElementById(id);
let LOTES = [], modo = null, soNovos = false;

fetch("data.json?" + Date.now())
  .then(r => r.json())
  .then(d => {
    LOTES = d.lotes || [];
    LOTES.forEach(l => {
      l._t = norm([l.tipo, l.edital, l.cidade, ...l.itens].join(" "));
      l._novo = l.visto && (Date.now() - Date.parse(l.visto) < TRES_DIAS);
    });
    if (d.atualizado) {
      const q = new Date(d.atualizado).toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", dateStyle: "short", timeStyle: "short" });
      $("sub").innerHTML = `${LOTES.length} lotes · atualizado em ${q} (Brasília) · <a href="https://www25.receita.fazenda.gov.br/sle-sociedade/portal" target="_blank" rel="noopener">abrir o portal da Receita</a>`;
    } else {
      $("sub").textContent = "Ainda sem dados: rode a primeira atualização na aba Actions do GitHub.";
    }
    render();
  })
  .catch(() => { $("sub").textContent = "Não consegui carregar os dados."; });

function render() {
  const termos = norm($("q").value).split(/\s+/).filter(Boolean);
  const filtrando = modo || termos.length || soNovos;
  let achados = [];
  if (filtrando) {
    achados = LOTES.filter(l => {
      if (soNovos && !l._novo) return false;
      if (modo === "ps5") return PS5.test(l._t);
      if (modo === "xbox") return XBOX.test(l._t);
      return termos.every(t => l._t.includes(t));
    });
    achados.sort((a, b) => (a.fim || "").localeCompare(b.fim || "") || a.lote - b.lote);
  }
  $("n").textContent = filtrando ? `${achados.length} lote(s) encontrado(s)` : "Digite um produto ou clique em um botão.";
  $("r").innerHTML = achados.slice(0, 300).map(l => `
    <div class="card">
      <div class="t">Lote ${l.lote} · ${esc(l.tipo)} · mínimo ${brl(l.minimo)}${l._novo ? '<span class="novo">NOVO</span>' : ""}</div>
      <div class="m">Edital ${esc(l.edital)} · ${esc(l.cidade)} · ${esc(l.situacao)} · propostas até ${esc(l.fim)} · lances ${esc(l.lances)}</div>
      <ul>${l.itens.map(i => `<li>${esc(i)}</li>`).join("") || "<li>Sem descrição detalhada</li>"}</ul>
      ${l.avisos.map(a => `<div class="av">Aviso: ${esc(a)}</div>`).join("")}
    </div>`).join("");
  $("ps5").classList.toggle("on", modo === "ps5");
  $("xbox").classList.toggle("on", modo === "xbox");
  $("novos").classList.toggle("on", soNovos);
}
$("q").addEventListener("input", () => { modo = null; render(); });
$("ps5").addEventListener("click", () => { modo = modo === "ps5" ? null : "ps5"; $("q").value = ""; render(); });
$("xbox").addEventListener("click", () => { modo = modo === "xbox" ? null : "xbox"; $("q").value = ""; render(); });
$("novos").addEventListener("click", () => { soNovos = !soNovos; render(); });
</script>
</body>
</html>
