name: Atualizar leilões

on:
  schedule:
    # 11h, 17h e 23h UTC = 8h, 14h e 20h no horário de Brasília
    - cron: "0 11,17,23 * * *"
  workflow_dispatch: # permite rodar na hora, pelo botão "Run workflow"

permissions:
  contents: write
  issues: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência
        run: pip install requests

      - name: Coletar leilões
        run: python coletar.py

      - name: Salvar dados
        run: |
          git config user.name "atualizador"
          git config user.email "atualizador@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza leilões"
            git push
          fi

      - name: Avisar por e-mail (PS5 novo)
        if: hashFiles('novos_alertas.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "@${{ github.repository_owner }} apareceu PS5 novo nos leilões da Receita:"
            echo
            cat novos_alertas.md
          } > corpo.md
          gh issue create --title "PS5 novo nos leilões da Receita" --body-file corpo.md
